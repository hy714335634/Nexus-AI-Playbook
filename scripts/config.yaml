source_repo:
  path: ../../Nexus-AI
  default_branch: main
models:
  default: global.anthropic.claude-opus-4-7
  complex: global.anthropic.claude-opus-4-7
languages:
- zh
- en
mappings:
- id: apps-center
  description: 应用中心（App Center）
  watches:
  - api/v2/routers/apps.py
  - api/v2/services/app_service.py
  - api/v2/services/apps_runtime.py
  - web/app/(main)/apps/**
  - web/components/apps/**
  docs:
  - path: user-guide/app-center.md
    prompt: feature-update.md
    model: default
  screenshots:
  - app-center
  - app-detail
- id: agents-build
  description: Agent 创建与构建流程
  watches:
  - api/v2/routers/agents.py
  - api/v2/services/agent_build_service.py
  - agents/system_agents/agent_build_workflow/**
  - agents/system_agents/agent_update_workflow/**
  - web/app/(main)/agents/**
  - web/components/agents/**
  docs:
  - path: user-guide/create-agent.md
    prompt: feature-update.md
    model: default
  - path: user-guide/manage-agents.md
    prompt: feature-update.md
    model: default
  screenshots:
  - create-agent
  - agent-list
  - agent-detail
- id: sessions-chat
  description: 对话与会话管理
  watches:
  - api/v2/routers/sessions.py
  - api/v2/services/agent_runtime_service.py
  - agents/system_agents/magician.py
  - web/app/(main)/chat/**
  - web/components/chat/**
  docs:
  - path: user-guide/chat.md
    prompt: feature-update.md
    model: default
  screenshots:
  - chat
- id: config-system
  description: 配置管理系统
  watches:
  - config/default_config.yaml
  - config/service_config.yaml
  - api/v2/routers/config.py
  - api/v2/config_registry.py
  - nexus_utils/config_loader.py
  - web/app/(main)/settings/**
  - web/components/config/**
  docs:
  - path: admin-guide/config-management.md
    prompt: config-reference.md
    model: default
  screenshots:
  - config-management
- id: skills-system
  description: Skill 系统
  watches:
  - api/v2/routers/skills.py
  - agents/system_agents/skill_build_workflow/**
  - web/app/(main)/ability/skills/**
  - web/components/skills/**
  docs:
  - path: user-guide/skills.md
    prompt: feature-update.md
    model: default
  screenshots:
  - skills
- id: tools-system
  description: 工具系统
  watches:
  - api/v2/routers/agent_tools.py
  - tools/**
  - agents/system_agents/tool_build_workflow/**
  - web/app/(main)/ability/tools/**
  docs:
  - path: user-guide/tools.md
    prompt: feature-update.md
    model: default
  screenshots:
  - tools
- id: connectors-integration
  description: 数据连接器与业务集成
  watches:
  - api/v2/routers/connectors.py
  - nexus_utils/data_connector/**
  - config/data_connector.yaml
  - web/app/(main)/integration/**
  docs:
  - path: user-guide/integration-center.md
    prompt: feature-update.md
    model: default
  - path: admin-guide/integrations-admin.md
    prompt: integration-guide.md
    model: default
  screenshots:
  - integration-center
- id: browser-extension
  description: 浏览器扩展功能
  watches:
  - api/v2/routers/browser.py
  - nexus_utils/browser/**
  - web/app/(main)/settings/browser-extension/**
  docs:
  - path: user-guide/browser-extension.md
    prompt: feature-update.md
    model: default
  screenshots:
  - browser-extension
- id: avatar-space
  description: Avatar 空间（数字分身）
  watches:
  - api/v2/routers/avatar.py
  - nexus_utils/avatar/**
  - config/avatar.yaml
  - config/knowledge_graph.yaml
  - web/app/(main)/home/**
  docs:
  - path: user-guide/avatar-space.md
    prompt: feature-update.md
    model: default
  screenshots:
  - avatar-space
  - my-home
- id: admin-system
  description: 管理与运维系统
  watches:
  - api/v2/routers/admin_services.py
  - api/v2/routers/admin_billing.py
  - api/v2/routers/audit.py
  - api/v2/routers/users.py
  - api/v2/routers/policies.py
  - nexus_utils/observability/**
  - web/app/(main)/admin/**
  - web/app/(main)/ops/**
  docs:
  - path: admin-guide/users-permissions.md
    prompt: feature-update.md
    model: default
  - path: admin-guide/audit.md
    prompt: feature-update.md
    model: default
  - path: admin-guide/billing.md
    prompt: feature-update.md
    model: default
  - path: admin-guide/service-status.md
    prompt: feature-update.md
    model: default
  screenshots:
  - admin-users
  - audit
  - billing
  - service-status
chapters:
  user-guide:
    title_zh: 用户手册
    title_en: User Guide
    output_dir: user-guide
    prompt_default: user-guide.md
    docs:
    - slug: first-login
      title_zh: 登录与界面导览
      title_en: Sign In & UI Tour
      sources:
      - web/app/(auth)/login/**
      - web/src/components/layout/sidebar.tsx
      extra_context:
      - scripts/state/explore/01-dashboard-home.md
    - slug: quickstart
      title_zh: 5 分钟快速上手
      title_en: Quickstart
      sources:
      - agents/system_agents/magician.py
      - nexus-cli
      - README.md
    - slug: learning-path
      title_zh: 学习路径
      title_en: Learning Path
      sources:
      - README.md
      - CLAUDE.md
    - slug: dashboard
      title_zh: 工作台
      title_en: Dashboard
      sources:
      - web/app/(main)/page.tsx
      - api/v2/routers/statistics.py
      - web/components/dashboard/**
      extra_context:
      - scripts/state/explore/01-dashboard-home.md
    - slug: create-agent
      title_zh: 创建 Agent
      title_en: Creating an Agent
      sources:
      - web/app/(main)/agents/new/**
      - api/v2/routers/agents.py
      - api/v2/routers/workflows.py
      - agents/system_agents/agent_build_workflow/**
      extra_context:
      - scripts/state/explore/02-agents-chat.md
    - slug: build-progress
      title_zh: 构建进度
      title_en: Build Progress
      sources:
      - api/v2/routers/projects.py
      - api/v2/routers/workflows.py
      - config/workflows.yaml
      - worker/main.py
      - worker/handlers/build_handler.py
      - web/app/(main)/projects/page.tsx
      extra_context:
      - scripts/state/explore/02-agents-chat.md
    - slug: chat
      title_zh: 对话
      title_en: Chat & Sessions
      sources:
      - web/app/(main)/chat/**
      - web/app/(main)/agents/[id]/chat/**
      - api/v2/routers/sessions.py
      - api/v2/services/agent_runtime_service.py
      - agents/system_agents/magician.py
      extra_context:
      - scripts/state/explore/02-agents-chat.md
    - slug: projects
      title_zh: 工坊管理
      title_en: Project Management
      sources:
      - api/v2/routers/projects.py
      - web/app/(main)/projects/page.tsx
      extra_context:
      - scripts/state/explore/03-projects-apps.md
    - slug: manage-agents
      title_zh: Agent 管理
      title_en: Managing Agents
      sources:
      - api/v2/routers/agents.py
      - web/app/(main)/agents/page.tsx
      - web/app/(main)/agents/new/page.tsx
      extra_context:
      - scripts/state/explore/02-agents-chat.md
    - slug: app-center
      title_zh: 应用中心
      title_en: App Center
      sources:
      - api/v2/routers/apps.py
      - api/v2/services/app_service.py
      - api/v2/services/apps_runtime.py
      - web/app/(main)/apps/**
      - web/components/apps/**
      extra_context:
      - scripts/state/explore/03-projects-apps.md
    - slug: tools
      title_zh: 工具库
      title_en: Tools
      sources:
      - api/v2/routers/agent_tools.py
      - web/app/(main)/ability/tools/**
      - tools/system_tools/agent_build_workflow/tool_template_provider.py
      - nexus_utils/tool_path.py
      extra_context:
      - scripts/state/explore/04-ability-integration.md
    - slug: skills
      title_zh: 技能系统
      title_en: Skills
      sources:
      - api/v2/routers/skills.py
      - agents/system_agents/skill_build_workflow/**
      - web/app/(main)/ability/skills/**
      extra_context:
      - scripts/state/explore/04-ability-integration.md
    - slug: integration-center
      title_zh: 业务集成中心
      title_en: Integration Center
      sources:
      - api/v2/routers/connectors.py
      - api/v2/routers/directives.py
      - api/v2/routers/template_assets.py
      - nexus_utils/data_connector/config_loader.py
      - nexus_utils/data_connector/registry.py
      - config/data_connector.yaml
      - web/app/(main)/integration/**
      extra_context:
      - scripts/state/explore/04-ability-integration.md
    - slug: resource-groups-sharing
      title_zh: 资源组与共享
      title_en: Resource Groups & Sharing
      sources:
      - api/v2/routers/resource_groups.py
      - api/v2/routers/resource_shares.py
      - api/v2/routers/groups.py
      - web/app/(main)/resource-groups/**
      extra_context:
      - scripts/state/explore/05-groups-events-evolution.md
    - slug: events
      title_zh: 事件任务
      title_en: Event Jobs
      sources:
      - api/v2/routers/event_jobs.py
      - nexus_utils/event_scheduler/**
      - web/app/(main)/events/**
      extra_context:
      - scripts/state/explore/05-groups-events-evolution.md
    - slug: assistants
      title_zh: 内置助手
      title_en: Helper Assistants
      sources:
      - prompts/system_agents_prompts/helper_agents/**
      - web/components/helpers/**
      extra_context:
      - scripts/state/explore/06-admin-settings-helpers.md
    - slug: browser-extension
      title_zh: 浏览器扩展
      title_en: Browser Extension
      sources:
      - api/v2/routers/browser.py
      - nexus_utils/browser/**
      - web/app/(main)/settings/browser-extension/**
      extra_context:
      - scripts/state/explore/06-admin-settings-helpers.md
    - slug: avatar-space
      title_zh: Avatar 空间
      title_en: Avatar Space
      sources:
      - api/v2/routers/avatar.py
      - nexus_utils/avatar/config/**
      - nexus_utils/avatar/service/routes/**
      - config/avatar.yaml
      - config/knowledge_graph.yaml
      - web/app/(main)/home/**
      extra_context:
      - scripts/state/explore/01-dashboard-home.md
    - slug: spotlight
      title_zh: Spotlight 命令面板
      title_en: Spotlight Command Palette
      sources:
      - web/components/spotlight/**
      extra_context:
      - scripts/state/explore/01-dashboard-home.md
    - slug: evolution-pfr-troubleshoot
      title_zh: 进化/PFR/故障排查
      title_en: Evolution/PFR/Troubleshoot
      sources:
      - api/v2/routers/missions.py
      - web/app/(main)/evolution/**
      - web/app/(main)/pfr/**
      - web/app/(main)/troubleshoot/**
      extra_context:
      - scripts/state/explore/05-groups-events-evolution.md
    - slug: tips
      title_zh: 技巧与最佳实践
      title_en: Tips & Best Practices
      sources:
      - CLAUDE.md
      - README.md
    - slug: publish-first-app
      title_zh: 发布第一个应用
      title_en: Publish Your First App
      sources:
      - api/v2/routers/apps.py
      - web/app/(main)/apps/**
      extra_context:
      - scripts/state/explore/03-projects-apps.md
    - slug: extend-agent-with-tools
      title_zh: 用工具扩展 Agent
      title_en: Extend Agent with Tools
      sources:
      - api/v2/routers/agent_tools.py
      - tools/**
      extra_context:
      - scripts/state/explore/04-ability-integration.md
    - slug: build-knowledge-qa
      title_zh: 构建知识问答 Agent
      title_en: Build a Knowledge Q&A Agent
      sources:
      - agents/generated_agents/**
      - prompts/generated_agents_prompts/**
    - slug: team-collaboration
      title_zh: 团队协作
      title_en: Team Collaboration
      sources:
      - api/v2/routers/resource_groups.py
      - api/v2/routers/groups.py
  admin-guide:
    title_zh: 管理员手册
    title_en: Administrator Guide
    output_dir: admin-guide
    prompt_default: admin-guide.md
    docs:
    - slug: deploy-upgrade
      title_zh: 部署与升级
      title_en: Deployment & Upgrade
      sources:
      - nexus-cli
      - config/deploy.yaml.template
      - infrastructure/release/README.md
      - docs/deployment/**
      prompt: admin-guide.md
    - slug: config-management
      title_zh: 配置管理
      title_en: Configuration Management
      sources:
      - api/v2/config_registry.py
      - web/components/config/ConfigManager.tsx
      - config/default_config.yaml
      prompt: admin-guide.md
      extra_context:
      - scripts/state/explore/06-admin-settings-helpers.md
    - slug: users-permissions
      title_zh: 用户与权限
      title_en: Users & Permissions
      sources:
      - api/v2/routers/users.py
      - api/v2/routers/policies.py
      - web/app/(main)/users/**
      prompt: admin-guide.md
      extra_context:
      - scripts/state/explore/05-groups-events-evolution.md
    - slug: resource-group-admin
      title_zh: 资源组管理
      title_en: Resource Group Administration
      sources:
      - api/v2/routers/resource_groups.py
      - api/v2/routers/resource_shares.py
      - web/app/(main)/resource-groups/**
      prompt: admin-guide.md
      extra_context:
      - scripts/state/explore/05-groups-events-evolution.md
    - slug: audit
      title_zh: 审计追踪
      title_en: Audit Trail
      sources:
      - api/v2/routers/audit.py
      - web/app/(main)/settings/audit/**
      prompt: admin-guide.md
      extra_context:
      - scripts/state/explore/06-admin-settings-helpers.md
    - slug: billing
      title_zh: 用量与计费
      title_en: Usage & Billing
      sources:
      - api/v2/routers/admin_billing.py
      - web/app/(main)/admin/billing/**
      prompt: admin-guide.md
      extra_context:
      - scripts/state/explore/06-admin-settings-helpers.md
    - slug: service-status
      title_zh: 服务状态监控
      title_en: Service Status Monitoring
      sources:
      - api/v2/routers/admin_services.py
      - web/app/(main)/admin/service-status/**
      prompt: admin-guide.md
      extra_context:
      - scripts/state/explore/06-admin-settings-helpers.md
    - slug: helper-agents
      title_zh: 内置 AI 助手（管理员）
      title_en: Built-in AI Assistants (Admin)
      sources:
      - config/default_config.yaml
      - prompts/system_agents_prompts/helper_agents/**
      prompt: admin-guide.md
      extra_context:
      - scripts/state/explore/06-admin-settings-helpers.md
    - slug: model-access
      title_zh: 模型目录与接入
      title_en: Model Catalog & Access
      sources:
      - config/model_catalog.yaml
      - web/app/(main)/settings/model-catalog/**
      prompt: admin-guide.md
      extra_context:
      - scripts/state/explore/06-admin-settings-helpers.md
    - slug: mcp
      title_zh: MCP 服务管理
      title_en: MCP Service Management
      sources:
      - nexus_utils/mcp/**
      - config/mcp/**
      - web/app/(main)/ability/mcp/**
      extra_context:
      - scripts/state/explore/04-ability-integration.md
      prompt: admin-guide.md
    - slug: sso-auth
      title_zh: 登录与 SSO
      title_en: Login & SSO
      sources:
      - api/v2/auth/**
      - config/app_manifest.yaml
      prompt: admin-guide.md
    - slug: integrations-admin
      title_zh: 外部集成管理
      title_en: External Integrations
      sources:
      - config/mcp/**
      - config/data_connector.yaml
      - api/v2/routers/connectors.py
      prompt: admin-guide.md
      extra_context:
      - scripts/state/explore/04-ability-integration.md
    - slug: faq-ops
      title_zh: 常见问题与排障
      title_en: FAQ & Troubleshooting
      sources:
      - docs/operations/**
      - README.md
      prompt: admin-guide.md
run:
  signatures_dir: signatures
  runs_dir: runs
  pricing:
    default:
      input_per_mtok: 15.0
      output_per_mtok: 75.0
    complex:
      input_per_mtok: 15.0
      output_per_mtok: 75.0
screenshots:
  enabled: auto
  base_url: https://d3sx15z6kvxyn3.cloudfront.net
  output_dir: ../docs/public/images
  login:
    user: admin
    password: nexus
