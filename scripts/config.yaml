source_repo:
  path: ../../Nexus-AI
  default_branch: main
models:
  default: global.anthropic.claude-opus-4-7
  complex: global.anthropic.claude-opus-4-7
languages:
- zh
- en
mappings:
- id: apps-center
  description: 应用中心（App Center）
  watches:
  - api/v2/routers/apps.py
  - api/v2/services/app_service.py
  - api/v2/services/apps_runtime.py
  - web/app/(main)/apps/**
  - web/components/apps/**
  docs:
  - path: using/app-center.md
    prompt: feature-update.md
    model: default
  screenshots:
  - app-center
  - app-detail
- id: agents-build
  description: Agent 创建与构建流程
  watches:
  - api/v2/routers/agents.py
  - api/v2/services/agent_build_service.py
  - agents/system_agents/agent_build_workflow/**
  - agents/system_agents/agent_update_workflow/**
  - web/app/(main)/agents/**
  - web/components/agents/**
  docs:
  - path: using/create-agent.md
    prompt: feature-update.md
    model: default
  - path: using/manage-agents.md
    prompt: feature-update.md
    model: default
  screenshots:
  - create-agent
  - agent-list
  - agent-detail
- id: sessions-chat
  description: 对话与会话管理
  watches:
  - api/v2/routers/sessions.py
  - api/v2/services/agent_runtime_service.py
  - agents/system_agents/magician.py
  - web/app/(main)/chat/**
  - web/components/chat/**
  docs:
  - path: using/chat.md
    prompt: feature-update.md
    model: default
  screenshots:
  - chat
- id: config-system
  description: 配置管理系统
  watches:
  - config/default_config.yaml
  - config/service_config.yaml
  - api/v2/routers/config.py
  - api/v2/config_registry.py
  - nexus_utils/config_loader.py
  - web/app/(main)/settings/**
  - web/components/config/**
  docs:
  - path: admin/config-management.md
    prompt: config-reference.md
    model: default
  - path: reference/config-options.md
    prompt: reference.md
    model: default
  screenshots:
  - config-management
- id: skills-system
  description: Skill 系统
  watches:
  - api/v2/routers/skills.py
  - agents/system_agents/skill_build_workflow/**
  - web/app/(main)/ability/skills/**
  - web/components/skills/**
  docs:
  - path: using/skills.md
    prompt: feature-update.md
    model: default
  - path: features/skills-system.md
    prompt: feature-overview.md
    model: default
  screenshots:
  - skills
- id: tools-system
  description: 工具系统
  watches:
  - api/v2/routers/agent_tools.py
  - tools/**
  - agents/system_agents/tool_build_workflow/**
  - web/app/(main)/ability/tools/**
  docs:
  - path: using/tools.md
    prompt: feature-update.md
    model: default
  - path: features/tools-toolsets.md
    prompt: feature-overview.md
    model: default
  screenshots:
  - tools
- id: connectors-integration
  description: 数据连接器与业务集成
  watches:
  - api/v2/routers/connectors.py
  - nexus_utils/data_connector/**
  - config/data_connector.yaml
  - web/app/(main)/integration/**
  docs:
  - path: using/integration-center.md
    prompt: feature-update.md
    model: default
  - path: integrations/data-connectors.md
    prompt: integration-guide.md
    model: default
  screenshots:
  - integration-center
- id: browser-extension
  description: 浏览器扩展功能
  watches:
  - api/v2/routers/browser.py
  - nexus_utils/browser/**
  - web/app/(main)/settings/browser-extension/**
  docs:
  - path: using/browser-extension.md
    prompt: feature-update.md
    model: default
  - path: integrations/browser-extension-integration.md
    prompt: integration-guide.md
    model: default
  screenshots:
  - browser-extension
- id: avatar-space
  description: Avatar 空间（数字分身）
  watches:
  - api/v2/routers/avatar.py
  - nexus_utils/avatar/**
  - config/avatar.yaml
  - config/knowledge_graph.yaml
  - web/app/(main)/home/**
  docs:
  - path: using/avatar-space.md
    prompt: feature-update.md
    model: default
  screenshots:
  - avatar-space
  - my-home
- id: admin-system
  description: 管理与运维系统
  watches:
  - api/v2/routers/admin_services.py
  - api/v2/routers/admin_billing.py
  - api/v2/routers/audit.py
  - api/v2/routers/users.py
  - api/v2/routers/policies.py
  - nexus_utils/observability/**
  - web/app/(main)/admin/**
  - web/app/(main)/ops/**
  docs:
  - path: admin/users-permissions.md
    prompt: feature-update.md
    model: default
  - path: admin/audit.md
    prompt: feature-update.md
    model: default
  - path: admin/billing.md
    prompt: feature-update.md
    model: default
  - path: admin/service-status.md
    prompt: feature-update.md
    model: default
  screenshots:
  - admin-users
  - audit
  - billing
  - service-status
chapters:
  getting-started:
    title_zh: 快速开始
    title_en: Getting Started
    output_dir: getting-started
    prompt_default: feature-overview.md
    docs:
    - slug: quickstart
      title_zh: 5 分钟快速上手
      title_en: Quickstart
      sources:
      - agents/system_agents/magician.py
      - nexus-cli
      - README.md
    - slug: installation
      title_zh: 安装 Nexus-AI
      title_en: Installation
      sources:
      - setup_env_alinux2023.sh
      - pyproject.toml
      - requirements.txt
      - README.md
    - slug: aws-setup
      title_zh: AWS 环境准备
      title_en: AWS Setup
      sources:
      - infrastructure/cloudformation/**
      - infrastructure/userdata/**
      - config/default_config.yaml
      - README.md
    - slug: updating
      title_zh: 升级与卸载
      title_en: Updating & Uninstalling
      sources:
      - nexus-cli
      - infrastructure/release/**
      - README.md
    - slug: learning-path
      title_zh: 学习路径
      title_en: Learning Path
      sources:
      - README.md
      - CLAUDE.md
  using:
    title_zh: 使用 Nexus-AI
    title_en: Using Nexus-AI
    output_dir: using
    prompt_default: feature-update.md
    docs:
    - slug: dashboard
