<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.25)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.1)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="128" height="128" rx="30" fill="url(#shine)"/>
  <!-- Inner shadow -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Letter N with glow -->
  <text x="64" y="84" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-weight="900" font-size="66" fill="white" filter="url(#glow)">N</text>
  <!-- Decorative dots -->
  <circle cx="22" cy="22" r="3" fill="rgba(255,255,255,0.2)"/>
  <circle cx="106" cy="106" r="3" fill="rgba(255,255,255,0.2)"/>
  <circle cx="106" cy="22" r="2" fill="rgba(255,255,255,0.12)"/>
  <circle cx="22" cy="106" r="2" fill="rgba(255,255,255,0.12)"/>
</svg>
