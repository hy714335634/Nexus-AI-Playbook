scenes:
  - id: s1-intro
    title: 开场：小王的痛点
    zh: 市场部的小王每周都要做竞品分析：手动搜资料、整理表格、写报告，一次要花两天。今天她要试试另一种方式——把这件事交给 Nexus-AI。
    en: "Wang from Marketing spends two days every week on competitor analysis: searching, organizing spreadsheets, writing reports. Today she's trying a different way — letting Nexus-AI do the heavy lifting."
    max_sec: 18
  - id: s2-create
    title: 新建应用
    zh: 打开应用中心，点「新建应用」。不用写一行代码——选一个内置的智能助手作为底座，就像挑一个懂行的同事。
    en: Open the App Center and click "New App". No code required — just pick a built-in assistant as the foundation, like choosing a capable teammate.
    max_sec: 16
  - id: s3-describe
    title: 一句话描述需求
    zh: 然后，用平常说话的方式描述需求：给市场团队用，粘贴竞品资料或网址，自动生成结构化的竞品分析报告，支持导出。说得越具体，做出来越贴心。
    en: "Then describe what you need in plain language: for the marketing team, paste competitor material or a URL, generate a structured analysis report, with export. The more specific, the better the result."
    max_sec: 20
  - id: s4-generating
    title: AI 自动生成
    zh: 点下「开始设计」，AI 开始工作：设计页面、编写交互、连接智能助手。这个过程通常几分钟，小王正好去倒杯咖啡。
    en: "Click \"Start Designing\" and the AI gets to work: laying out the page, wiring up interactions, connecting the assistant. It takes a few minutes — just enough for a coffee."
    max_sec: 15
  - id: s5-ready
    title: 应用就绪
    zh: 回来时，应用已经就绪。右侧是实时预览——输入框、结果区、导出按钮，和她描述的一模一样。
    en: "By the time she's back, the app is ready. The live preview shows exactly what she described: input box, results area, export button."
    max_sec: 14
  - id: s6-publish
    title: 一键发布
    zh: 接下来是关键一步：发布。选择有效期和访问方式——公开、需要密码、或者 API 调用。点击发布，平台生成一条专属链接。
    en: "Now the key step: publishing. Choose validity and access — public, password-protected, or API. One click, and the platform generates a shareable link."
    max_sec: 16
  - id: s7-anon-use
    title: 全公司即开即用
    zh: 把链接发到部门群里，同事们不用注册、不用安装，打开就能用。每个人的竞品分析，从两天变成两分钟。
    en: "Share the link in the team chat. No sign-up, no install — colleagues just open it and go. Competitor analysis drops from two days to two minutes."
    max_sec: 18
  - id: s8-nl-update
    title: 一句话迭代
    zh: 一周后，同事提议：能不能加个评分雷达图？小王不用找开发排期——在版本面板输入一句话，AI 自动分析改动、更新开发、重新部署。
    en: "A week later, a colleague asks: can we add a radar chart? No dev tickets needed — Wang types one sentence in the version panel, and the AI analyzes, develops, and redeploys."
    max_sec: 20
  - id: s9-versions
    title: 版本与回退
    zh: 每次更新都是一个新版本，随时可以一键回退。放心改，不怕错。
    en: Every update becomes a new version, and rolling back is one click. Iterate boldly.
    max_sec: 10
  - id: s10-value
    title: 价值总结
    zh: 一句话需求、几分钟构建、一条链接交付、一句话迭代。这就是 Nexus-AI 应用中心——让每个业务人员都能把想法变成全公司的生产力。
    en: "One sentence to build, minutes to generate, one link to deliver, one sentence to iterate. That's the Nexus-AI App Center — turning every team member's ideas into company-wide productivity."
    max_sec: 16
